# Builds the backend image, pushes it to Artifact Registry, and
# deploys it to Cloud Run.
#
# Run with:
#   gcloud builds submit --config cloudbuild.yaml \
#       --substitutions=_ENV_VARS_FILE=.env.production
#
# Environment variables are read from a plain KEY=VALUE file
# (default .env.production, one per line, no quoting), converted
# to a YAML file, and passed to `gcloud run deploy` via
# --env-vars-file (not --set-env-vars: several values here, e.g.
# ALLOWED_ORIGINS, contain commas, which --set-env-vars would
# misparse as separate keys). Keep real secrets (JWT_SECRET_KEY,
# DB_PASSWORD, GROQ/GEMINI keys, ...) out of that file in source
# control; for a team setup, move them into Secret Manager and
# reference them with --set-secrets instead.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: debate-coach-backend
  _REPOSITORY: debate-coach
  _CLOUD_SQL_INSTANCE: debate-coach-508804:us-central1:debate-coach-db
  _ENV_VARS_FILE: .env.production
  # e.g. "--no-traffic --tag=verify" to smoke-test a revision on
  # its own tag URL before it takes production traffic.
  _EXTRA_DEPLOY_FLAGS: ""

steps:
  # --- Build ---
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  # --- Push ---
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}
      - --all-tags

  # --- Deploy ---
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # $$ below is Cloud Build's escape for a literal $ — these
        # are ordinary bash variables/expansions, not Cloud Build
        # substitutions, and must survive Cloud Build's own
        # templating pass untouched.
        if [ -f "${_ENV_VARS_FILE}" ]; then
          ENV_YAML=".cloudbuild-env-vars.yaml"
          : > "$$ENV_YAML"
          while IFS= read -r line || [ -n "$$line" ]; do
            case "$$line" in
              ''|'#'*) continue ;;
            esac
            key=$${line%%=*}
            value=$${line#*=}
            value=$${value//\'/\'\'}
            printf "%s: '%s'\n" "$$key" "$$value" >> "$$ENV_YAML"
          done < "${_ENV_VARS_FILE}"
          DEPLOY_ENV_FLAG="--env-vars-file=$$ENV_YAML"
        else
          echo "Warning: ${_ENV_VARS_FILE} not found, deploying with no env vars set."
          DEPLOY_ENV_FLAG=""
        fi

        gcloud run deploy ${_SERVICE_NAME} \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --add-cloudsql-instances ${_CLOUD_SQL_INSTANCE} \
          $$DEPLOY_ENV_FLAG \
          ${_EXTRA_DEPLOY_FLAGS} \
          --allow-unauthenticated \
          --memory 2Gi \
          --cpu 2 \
          --timeout 300 \
          --concurrency 4

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
  - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
