# This machine has limited RAM (see CLAUDE.md): keep Gradle small.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmOptions=-Xmx1g
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The "local" build's backend. Override per machine without editing this
# file: ./gradlew assembleLocalDebug -PlocalApiUrl=http://192.168.1.20:8000
# (or put localApiUrl=... in ~/.gradle/gradle.properties).
localApiUrl=http://192.168.1.100:8000
